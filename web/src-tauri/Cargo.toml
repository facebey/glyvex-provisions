[package]
name = "glyvex-provisions"
version = "0.1.2"
description = "Glyvex Provisions — shell Tauri (sidecar FastAPI)"
edition = "2021"

[lib]
name = "glyvex_provisions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
# required por updater:install() para reiniciar la app tras aplicar la update
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# health-check del sidecar sin arrastrar reqwest/tokio (mismo criterio que la Suite)
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
